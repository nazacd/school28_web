# ---------------------------------------------------------------------------
# school28.uz — school website (school28-web container, internal :4321)
#
# Append this to /opt/sat-makon/makonbook/nginx/default.conf.
# STEP 1: add only the port-80 block, reload nginx, issue the certificate.
# STEP 2: add the port-443 block, reload nginx.  (README → Deployment)
# ---------------------------------------------------------------------------

# HTTP: serve ACME challenge, redirect everything else to HTTPS
server {
    listen 80;
    server_name school28.uz www.school28.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://school28.uz$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name school28.uz www.school28.uz;
    client_max_body_size 1m;   # contact form only; CMS uploads go straight to GitHub

    # Own certificate lineage, so this site can never break the other two.
    ssl_certificate /etc/letsencrypt/live/school28.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/school28.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # www -> apex
    if ($host = www.school28.uz) {
        return 301 https://school28.uz$request_uri;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/json application/xml application/rss+xml image/svg+xml;

    # Variable upstream + Docker DNS: nginx still boots (and keeps serving the
    # other sites) while school28-web is down or being redeployed.
    resolver 127.0.0.11 valid=30s;
    set $school28_upstream http://school28-web:4321;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_redirect off;

    # Fingerprinted build assets (CSS, fonts) never change: cache for a year.
    location /_astro/ {
        proxy_pass $school28_upstream;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /uploads/ {
        proxy_pass $school28_upstream;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location / {
        proxy_pass $school28_upstream;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
