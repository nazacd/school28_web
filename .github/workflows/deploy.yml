# Build → push to Docker Hub → deploy on the VPS.
#
# Every push to main (including "Publish" in the /admin editor) rebuilds the
# site and updates https://school28.uz within a few minutes.
# Pull requests are only built and checked, never deployed.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME   Docker Hub user (nazacd)
#   DOCKERHUB_TOKEN      Docker Hub access token (Read & Write)
#   VPS_HOST             server IP or hostname
#   VPS_USER             SSH user (e.g. root)
#   VPS_SSH_KEY          private key of the dedicated deploy key
#   VPS_KNOWN_HOSTS      output of `ssh-keyscan -H <server>` (pins the server's identity)
# Optional:
#   VPS_PORT             SSH port (default 22)

name: Build & deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - PLAN.md
      - DEPLOY.md
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push replaces a deploy that is still waiting or running.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'production' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: nazacd/school28-web
  SITE_URL: https://school28.uz

jobs:
  check:
    name: Type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  image:
    name: Build & push image
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            SITE_URL=${{ env.SITE_URL }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://school28.uz
    steps:
      - name: Run deploy script on the server
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          # The deploy key is locked to /opt/school28/deploy.sh on the server (forced command),
          # so this connection can do nothing except redeploy the site.
          ssh -i ~/.ssh/deploy_key -p "${PORT:-22}" -o BatchMode=yes "$USER@$HOST" /opt/school28/deploy.sh

      - name: Check the live site
        run: |
          for i in $(seq 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://school28.uz/uz/) || true
            [ "$code" = "200" ] && echo "https://school28.uz is up" && exit 0
            sleep 3
          done
          echo "Site returned $code" && exit 1
